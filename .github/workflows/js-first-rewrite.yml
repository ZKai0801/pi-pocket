name: JS-first rewrite

# Trimmed by Plan 5 Task 6 to the gates that still apply to this fork: a
# single-shell, Android-only PocketShell with no `origin` remote. The packaged
# JS journey lanes, their result guards, the emulator boot and the Docker lane
# fixtures were removed together with the `androidTest` journeys they drove
# (Plan 5 Task 3). What remains guards the JS unit gate, the dev-mode shim
# guard, the native unit-test and close-accounting regressions, the APK build
# and its derived identity, and the browser dev:live bridge.
#
# What was removed and why is recorded in docs/fork-gate-posture.md. Do not put
# a step back here without a journey that a phone-shell screen can actually
# reach: every lane below used to select a class that no longer exists.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: js-first-rewrite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  web-and-android:
    name: JS checks and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with pinned core source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # versionCode is derived from reachable release tags; a shallow
          # checkout would build the placeholder version while the APK still
          # appeared internally consistent.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check exact JavaScript unit gate
        run: |
          scripts/check-js-unit-results.py --self-test
          scripts/run-js-unit-gate.sh

      # Issue #3022: the browser dev mode (pnpm dev:mock) must keep booting
      # the phone shell with no Android, and its shim guard must stay sharp.
      - name: Check browser dev-mode shim guard and run the dev:mock smoke
        run: |
          python3 scripts/check-no-dev-shims.py --self-test
          node scripts/dev-browser-smoke.mjs mock --artifacts build/dev-browser-smoke/mock

      - name: Check authorized_keys install under every login shell (Docker, issue 3021)
        run: tests/scripts/authorized-key-install-login-shells-test.sh

      - name: Build Android debug APK
        run: pnpm build:android:debug

      - name: Prove browser dev-mode shims are absent from the built APK (issue #3022)
        run: python3 scripts/check-no-dev-shims.py --dist dist --apk android/app/build/outputs/apk/debug/app-debug.apk

      # Issue #2856: run after the debug APK step above has generated the
      # ignored Capacitor Gradle inputs; validate fresh results from all four
      # production close paths in this required JS-first check.
      - name: Run native SSH close-accounting unit regression (issue #2856)
        shell: bash
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/ssh-close-unit-start"
          set -o pipefail
          android/gradlew -p android :app:testDebugUnitTest \
            --tests com.pocketshell.app.SshCapabilityPluginCloseTest \
            --rerun-tasks --no-build-cache --no-daemon --stacktrace --console=plain \
            2>&1 | tee "${RUNNER_TEMP}/ssh-close-unit-gradle.log"
          python3 - "${RUNNER_TEMP}/ssh-close-unit-start" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path("android/app/build/test-results/testDebugUnitTest/TEST-com.pocketshell.app.SshCapabilityPluginCloseTest.xml")
          marker = Path(sys.argv[1])
          if not report.is_file():
              raise SystemExit(f"FAIL: missing close-accounting JUnit report: {report}")
          if report.stat().st_mtime_ns <= marker.stat().st_mtime_ns:
              raise SystemExit("FAIL: close-accounting JUnit report predates this run")
          root = ET.parse(report).getroot()
          cases = root.findall("testcase")
          if not cases or int(root.attrib.get("tests", "0")) != len(cases):
              raise SystemExit("FAIL: close-accounting report declares no tests or disagrees with testcase rows")
          if int(root.attrib.get("skipped", "0")) != 0 or int(root.attrib.get("failures", "0")) != 0 or int(root.attrib.get("errors", "0")) != 0:
              raise SystemExit("FAIL: close-accounting class has skipped, failed, or errored tests")
          names = {case.attrib.get("name") for case in cases}
          required = {
              "actualConnectionCloseKeepsSnapshotEntryUntilNativeSocketCloses",
              "productionPtyCloseKeepsSnapshotEntryUntilNativeChannelCloses",
              "productionSftpCloseKeepsSnapshotEntryUntilNativeClientCloses",
              "productionForwardCloseKeepsSnapshotEntryUntilNativeListenerCloses",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"FAIL: required production-path regressions did not execute: {missing}")
          print(f"PASS: {len(cases)} close-accounting tests executed; connection, PTY, SFTP, and forward regressions present")
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Run native Android unit tests
        run: scripts/run-android-unit-gate.sh

      - name: Validate packaged Android identity and derived version
        run: |
          scripts/check-js-apk-metadata.py --self-test
          scripts/derive-version.sh --self-test
          version_code="$(scripts/derive-version.sh version-code)"
          version_name="$(scripts/derive-version.sh version-name)"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          scripts/check-js-apk-metadata.py \
            --apk "$apk" \
            --variant debug \
            --expected-version-code "$version_code" \
            --expected-version-name "$version_name"
          scripts/check-apk-signing.sh --variant debug --js-first --apk "$apk"

      # The Docker agents fixture and the dev:live smoke stay: the browser
      # dev:live bridge against a real SSH host is a shipped path, and it is
      # the only thing left that exercises the fixture end to end.
      - name: Start version-matched Docker agents fixture
        run: |
          source scripts/lib/agents-fixture-version.sh
          export_agents_fixture_version_for_run 0 android/app/build/outputs/apk/debug/app-debug.apk
          scripts/ci-journey-fixture-retry.sh agents -- docker compose -f tests/docker/docker-compose.yml up -d --build --no-deps agents
          source tests/docker/lib/wait-for-healthy.sh
          wait_for_container_healthy tests/docker/docker-compose.yml agents /tmp/js-lifecycle-agents-health.log 60
          cat /tmp/js-lifecycle-agents-health.log

      # Issue #3022: dev:live through the local ssh2 bridge must connect and
      # trust the fixture's host key, checked against an independent handshake.
      - name: Run the browser dev:live smoke against the Docker agents fixture
        run: node scripts/dev-browser-smoke.mjs live --host testuser@127.0.0.1:2222=fixture --identity tests/docker/test_key --artifacts build/dev-browser-smoke/live

      - name: Upload browser dev-mode smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-browser-dev-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/dev-browser-smoke/
          if-no-files-found: warn

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Stop Docker agents fixture
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down --volumes --remove-orphans
